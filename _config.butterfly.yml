# ---------------------------------------------------------------
# Butterfly 主题覆盖配置
# 完整项见 node_modules/hexo-theme-butterfly/_config.yml
# 官方文档：https://butterfly.js.org/
# ---------------------------------------------------------------

# 导航栏
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 菜单（简体中文）
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# 头像与图标
avatar:
  img: /images/avatar.png
  effect: false

favicon: /images/avatar.png

# 背景：浅色渐变（页面主体底色）
background: "linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #f0fdfa 100%)"

# 顶部横幅图：深海女仆工坊 · 宫殿夜景
index_img: /img/palace-night.webp
default_top_img: /img/palace-night.webp

# 社交链接
social:
  fab fa-github: https://github.com/KeivenJian || Github || '#24292f'

# 代码块
code_blocks:
  theme: light
  copy: true
  language: true

# 文章元信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 字数统计与阅读时长
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 本地搜索（依赖 hexo-generator-searchdb）
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1

# 评论：Utterances
comments:
  use: Utterances
  text: true
  lazyload: false
  count: false

utterances:
  repo: KeivenJian/Keiven-simple-blog
  issue_term: pathname
  light_theme: github-light
  dark_theme: photon-dark

# ---------------------------------------------------------------
# 页面注入：右下角深海女仆桌宠（点击说话，自动上浮动画）
# ---------------------------------------------------------------
inject:
  bottom:
    - |
      <div id="pet-wrap" aria-label="深海女仆桌宠">
        <div id="pet-bubble"></div>
        <img id="pet-img" src="/img/maid-pet.webp" alt="深海女仆桌宠">
      </div>
      <style>
      #pet-wrap{position:fixed;right:18px;bottom:0;z-index:9990;width:170px;cursor:pointer;user-select:none;transition:transform .25s ease;}
      #pet-wrap:hover{transform:scale(1.04) translateY(-4px);}
      #pet-img{width:100%;display:block;filter:drop-shadow(0 10px 22px rgba(10,20,50,.45));animation:petFloat 3.8s ease-in-out infinite;}
      @keyframes petFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      #pet-bubble{position:absolute;right:100%;bottom:58%;margin-right:12px;background:#fff;color:#1f2a44;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;max-width:210px;box-shadow:0 8px 24px rgba(10,20,50,.18);opacity:0;transform:translateX(8px);transition:.3s ease;pointer-events:none;}
      #pet-bubble::after{content:"";position:absolute;left:100%;top:16px;border:7px solid transparent;border-left-color:#fff;}
      #pet-bubble.show{opacity:1;transform:translateX(0);}
      @media(max-width:768px){#pet-wrap{width:110px;right:6px;}#pet-bubble{max-width:150px;font-size:12px;}}
      </style>
      <script>
      (function(){
        var pet=document.getElementById('pet-wrap'),bubble=document.getElementById('pet-bubble');
        if(!pet||!bubble)return;
        var lines=['欢迎来到 Keiven 的博客～','今天也在偷偷吃 token 哦','点我干嘛，快去读文章啦','这篇写得不错吧？','有问题就喊本鱼～','深海女仆工坊，为您服务'];
        var timer=null;
        function say(){bubble.textContent=lines[Math.floor(Math.random()*lines.length)];bubble.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){bubble.classList.remove('show');},3600);}
        pet.addEventListener('click',say);
        setTimeout(say,2200);
      })();
      </script>
