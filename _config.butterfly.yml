# ---------------------------------------------------------------
# Butterfly 主题覆盖配置
# 完整项见 node_modules/hexo-theme-butterfly/_config.yml
# 官方文档：https://butterfly.js.org/
# ---------------------------------------------------------------

# 导航栏
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 菜单（简体中文）
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# 头像与图标
avatar:
  img: /images/avatar.png
  effect: false

favicon: /images/avatar.png

# 背景：浅色渐变（页面主体底色）
background: "linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #f0fdfa 100%)"

# 顶部横幅图：深海女仆工坊 · 宫殿夜景
index_img: /img/palace-night.webp
default_top_img: /img/palace-night.webp

# 社交链接
social:
  fab fa-github: https://github.com/KeivenJian || Github || '#24292f'

# 代码块
code_blocks:
  theme: light
  copy: true
  language: true

# 文章元信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 字数统计与阅读时长
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 本地搜索（依赖 hexo-generator-searchdb）
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1

# 评论：Utterances
comments:
  use: Utterances
  text: true
  lazyload: false
  count: false

utterances:
  repo: KeivenJian/Keiven-simple-blog
  issue_term: pathname
  light_theme: github-light
  dark_theme: photon-dark

# 简繁切换（主题内置，右下角工具栏）
translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: '繁'
  msgToSimplifiedChinese: '简'

# ---------------------------------------------------------------
# 页面注入：右下角深海女仆桌宠（可拖动，位置会记住）
# ---------------------------------------------------------------
inject:
  bottom:
    - |
      <div id="pet-wrap" aria-label="深海女仆桌宠">
        <div id="pet-bubble"></div>
        <img id="pet-img" src="/img/maid-pet.webp" alt="深海女仆桌宠" draggable="false">
      </div>
      <style>
      #pet-wrap{position:fixed;right:18px;bottom:0;z-index:9990;width:170px;cursor:grab;user-select:none;touch-action:none;transition:transform .25s ease;}
      #pet-wrap.dragging{transition:none;cursor:grabbing;transform:none;}
      #pet-wrap:hover{transform:scale(1.04) translateY(-4px);}
      #pet-img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 10px 22px rgba(10,20,50,.45));animation:petFloat 3.8s ease-in-out infinite;}
      @keyframes petFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      #pet-bubble{position:absolute;left:50%;bottom:100%;margin-bottom:10px;transform:translateX(-50%) translateY(6px);background:#fff;color:#1f2a44;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;max-width:210px;width:max-content;box-shadow:0 8px 24px rgba(10,20,50,.18);opacity:0;transition:.3s ease;pointer-events:none;}
      #pet-bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;}
      #pet-bubble.show{opacity:1;transform:translateX(-50%) translateY(0);}
      @media(max-width:768px){#pet-wrap{width:110px;right:6px;}#pet-bubble{max-width:150px;font-size:12px;}}
      </style>
      <script>
      (function(){
        var pet=document.getElementById('pet-wrap'),bubble=document.getElementById('pet-bubble');
        if(!pet||!bubble)return;
        var lines=['欢迎来到 Keiven 的博客～','今天也在偷偷吃 token 哦','点我干嘛，快去读文章啦','这篇写得不错吧？','有问题就喊本鱼～','深海女仆工坊，为您服务'];
        var timer=null;
        function say(){bubble.textContent=lines[Math.floor(Math.random()*lines.length)];bubble.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){bubble.classList.remove('show');},3600);}
        function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

        // 恢复上次位置
        try{
          var saved=JSON.parse(localStorage.getItem('pet-pos')||'null');
          if(saved && typeof saved.left==='number' && typeof saved.top==='number'){
            pet.style.right='auto';pet.style.bottom='auto';
            pet.style.left=clamp(saved.left,0,window.innerWidth-pet.offsetWidth)+'px';
            pet.style.top=clamp(saved.top,0,window.innerHeight-pet.offsetHeight)+'px';
          }
        }catch(err){}

        var dragging=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0;

        pet.addEventListener('pointerdown',function(e){
          if(e.button!==undefined && e.button!==0)return;
          dragging=true;moved=false;
          startX=e.clientX;startY=e.clientY;
          var r=pet.getBoundingClientRect();
          startLeft=r.left;startTop=r.top;
          pet.style.right='auto';pet.style.bottom='auto';
          pet.style.left=startLeft+'px';pet.style.top=startTop+'px';
          pet.classList.add('dragging');
          try{pet.setPointerCapture(e.pointerId);}catch(err){}
          e.preventDefault();
        });

        pet.addEventListener('pointermove',function(e){
          if(!dragging)return;
          var dx=e.clientX-startX,dy=e.clientY-startY;
          if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
          var left=clamp(startLeft+dx,0,window.innerWidth-pet.offsetWidth);
          var top=clamp(startTop+dy,0,window.innerHeight-pet.offsetHeight);
          pet.style.left=left+'px';pet.style.top=top+'px';
          e.preventDefault();
        });

        function endDrag(e){
          if(!dragging)return;
          dragging=false;
          pet.classList.remove('dragging');
          var r=pet.getBoundingClientRect();
          try{localStorage.setItem('pet-pos',JSON.stringify({left:r.left,top:r.top}));}catch(err){}
          if(!moved)say();
        }
        pet.addEventListener('pointerup',endDrag);
        pet.addEventListener('pointercancel',endDrag);

        // 窗口尺寸变化时保持可见
        window.addEventListener('resize',function(){
          var r=pet.getBoundingClientRect();
          pet.style.right='auto';pet.style.bottom='auto';
          pet.style.left=clamp(r.left,0,window.innerWidth-pet.offsetWidth)+'px';
          pet.style.top=clamp(r.top,0,window.innerHeight-pet.offsetHeight)+'px';
        });

        setTimeout(say,2200);
      })();
      </script>
    - |
      <style>
      #translateLink{display:none !important;}
      #rightside .lang-btn{font-size:12px;font-weight:700;}
      #rightside .lang-btn.active{color:#4d6bfe;}
      </style>
      <script>
      (function(){
        function init(){
        var EN={'首页':'Home','归档':'Archives','分类':'Categories','标签':'Tags','关于':'About','搜索':'Search'};
        var originals=[];
        var state='zh';
        var buttons=[];

        function isTw(){
          var m=document.cookie.match(/translate-chn-cht=(\d)/);
          return m && Number(m[1])===1;
        }
        function toggleTw(){
          if(window.translateFn && typeof window.translateFn.translatePage==='function'){
            window.translateFn.translatePage();
          }
        }
        function walk(root,fn){
          var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
          var n;
          while((n=w.nextNode()))fn(n);
        }
        function toEN(){
          var nav=document.getElementById('nav')||document.body;
          walk(nav,function(n){
            var t=n.nodeValue.trim();
            if(EN[t]){originals.push({node:n,text:n.nodeValue});n.nodeValue=n.nodeValue.replace(t,EN[t]);}
          });
          var ph=document.querySelector('.search input[placeholder]');
          if(ph && ph.placeholder){ph.dataset.zhPh=ph.placeholder;ph.placeholder='Search';}
        }
        function toZH(){
          originals.forEach(function(o){o.node.nodeValue=o.text;});
          originals=[];
          var ph=document.querySelector('.search input[placeholder]');
          if(ph && ph.dataset.zhPh){ph.placeholder=ph.dataset.zhPh;delete ph.dataset.zhPh;}
        }
        function sync(){
          buttons.forEach(function(b){b.classList.toggle('active',b.dataset.lang===state);});
          localStorage.setItem('lang-state',state);
        }
        function apply(s){
          if(state==='en' && s!=='en')toZH();
          if(isTw() && s!=='tw')toggleTw();
          if(s==='tw' && !isTw())toggleTw();
          if(s==='en')toEN();
          state=s;
          sync();
        }

        // 把语言按钮插入右侧工具栏的折叠菜单
        var wrap=document.getElementById('rightside-config-hide');
        if(wrap){
          var ref=document.getElementById('translateLink');
          [{l:'zh',t:'简',tip:'简体中文'},{l:'tw',t:'繁',tip:'繁體中文'},{l:'en',t:'EN',tip:'English'}].forEach(function(item){
            var b=document.createElement('button');
            b.type='button';
            b.className='lang-btn';
            b.dataset.lang=item.l;
            b.textContent=item.t;
            b.title=item.tip;
            b.addEventListener('click',function(){apply(item.l);});
            if(ref && ref.parentNode===wrap){wrap.insertBefore(b,ref);}else{wrap.appendChild(b);}
            buttons.push(b);
          });
        }

        sync();
        var saved=localStorage.getItem('lang-state');
        if(saved && saved!=='zh'){setTimeout(function(){apply(saved);},400);}
        }
        var tries=0;
        function boot(){
          if(document.getElementById('rightside-config-hide') || tries++>50){init();}
          else{setTimeout(boot,100);}
        }
        boot();
      })();
      </script>
