# ---------------------------------------------------------------
# Butterfly 主题覆盖配置
# 完整项见 node_modules/hexo-theme-butterfly/_config.yml
# 官方文档：https://butterfly.js.org/
# ---------------------------------------------------------------

# 导航栏
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 菜单（简体中文）
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# 头像与图标
avatar:
  img: /images/avatar.png
  effect: false

favicon: /images/avatar.png

# 背景：浅色渐变（页面主体底色）
background: "linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #f0fdfa 100%)"

# 顶部横幅图：深色夜景，已压缩到 65KB
index_img: /img/default.jpg
default_top_img: /img/default.jpg

# 社交链接
social:
  fab fa-github: https://github.com/KeivenJian || Github || '#24292f'

# 代码块
code_blocks:
  theme: light
  copy: true
  language: true

# 文章元信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 字数统计与阅读时长
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 本地搜索（依赖 hexo-generator-searchdb）
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1

# 评论：Utterances
comments:
  use: Utterances
  text: true
  lazyload: false
  count: false

utterances:
  repo: KeivenJian/Keiven-simple-blog
  issue_term: pathname
  light_theme: github-light
  dark_theme: photon-dark
