<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Keiven Blog · 写作后台</title>
<style>
  :root{
    --bg:#0b1a33; --panel:#101f3d; --panel-2:#152a4f; --line:#243b63;
    --text:#e8eefc; --muted:#8ea4c8; --primary:#4d6bfe; --ok:#2dd4a7; --err:#ff6b81;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    display:flex;height:100vh;overflow:hidden;
  }
  /* ---------- 左侧文章列表 ---------- */
  aside{
    width:280px;flex:0 0 280px;background:var(--panel);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  .side-head{padding:18px 16px;border-bottom:1px solid var(--line);}
  .side-head h1{font-size:16px;margin:0 0 12px;letter-spacing:.5px;}
  .side-head button{
    width:100%;padding:9px;border:0;border-radius:8px;background:var(--primary);
    color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  }
  .side-head button:hover{filter:brightness(1.1);}
  #list{flex:1;overflow-y:auto;padding:8px;}

  /* ---------- 滚动条：让侧栏和主区的滚动条可见 ---------- */
  #list::-webkit-scrollbar,
  .main-scroll::-webkit-scrollbar,
  .search-results::-webkit-scrollbar{width:8px;}
  #list::-webkit-scrollbar-thumb,
  .main-scroll::-webkit-scrollbar-thumb,
  .search-results::-webkit-scrollbar-thumb{
    background:rgba(142,164,200,.35);border-radius:4px;
  }
  #list::-webkit-scrollbar-thumb:hover,
  .main-scroll::-webkit-scrollbar-thumb:hover,
  .search-results::-webkit-scrollbar-thumb:hover{
    background:rgba(142,164,200,.6);
  }
  #list::-webkit-scrollbar-track,
  .main-scroll::-webkit-scrollbar-track,
  .search-results::-webkit-scrollbar-track{background:transparent;}
  /* Firefox */
  #list, .main-scroll, .search-results{
    scrollbar-width:thin;
    scrollbar-color:rgba(142,164,200,.45) transparent;
  }
  .side-search{padding:0 12px 10px;}
  .side-search input{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:12px;outline:none;
  }
  .side-search input:focus{border-color:var(--primary);}

  /* 筛选：全部 / 已发布 / 隐藏 */
  .side-filter{display:flex;gap:6px;padding:0 12px 10px;}
  .filter-btn{
    flex:1;padding:5px 0;border:1px solid var(--line);border-radius:7px;
    background:transparent;color:var(--muted);font-size:11px;cursor:pointer;
  }
  .filter-btn:hover{color:var(--text);}
  .filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .item{
    display:flex;align-items:center;gap:4px;
    padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;
    color:var(--muted);margin-bottom:2px;
  }
  .item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-cat{font-size:11px;color:var(--muted);opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* 隐藏的文章：淡化 + 删除线 */
  .item.hidden-post .item-name{opacity:.5;text-decoration:line-through;}
  /* 列表项右侧的小按钮（隐藏 / 删除），悬停出现 */
  .item-btn{
    flex:none;width:22px;height:22px;border:0;border-radius:6px;
    background:transparent;color:var(--muted);font-size:13px;line-height:1;cursor:pointer;
    opacity:0;transition:.15s;
  }
  .item:hover .item-btn{opacity:1;}
  .item-btn:hover{background:rgba(255,255,255,.08);}
  .item-btn.del:hover{background:rgba(255,107,129,.15);color:var(--err);}
  .item:hover{background:var(--panel-2);color:var(--text);}
  .item.active{background:var(--panel-2);color:#fff;box-shadow:inset 3px 0 0 var(--primary);}
  /* ---------- 右侧编辑区 ---------- */
  main{flex:1;display:flex;flex-direction:column;padding:20px 24px;gap:12px;min-width:0;overflow:hidden;}
  /* 中间滚动区：内容超出时只滚动这一块，底部按钮固定 */
  .main-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px;}
  .token-box{
    border:1px dashed var(--line);border-radius:10px;padding:12px 14px;
    background:var(--panel);
  }
  .token-box.hidden{display:none;}
  .token-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .token-box input{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:13px;outline:none;
  }
  .row{display:flex;gap:12px;}
  .row > div{flex:1;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input[type=text],textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;font-family:inherit;
    outline:none;
  }
  input:focus,textarea:focus{border-color:var(--primary);}
  textarea{flex:none;resize:vertical;height:clamp(220px,42vh,600px);min-height:220px;line-height:1.7;font-size:14px;}
  .fields{display:flex;flex-direction:column;gap:12px;flex:none;}
  .editor{flex:none;display:flex;flex-direction:column;}
  .actions{display:flex;align-items:center;gap:12px;}
  .actions button{
    padding:10px 20px;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  #btn-save{background:var(--primary);color:#fff;}
  #btn-save:hover{filter:brightness(1.1);}
  #btn-delete{background:transparent;color:var(--err);border:1px solid var(--err);}
  #btn-delete:hover{background:rgba(255,107,129,.12);}
  #btn-delete:disabled{opacity:.35;cursor:not-allowed;}
  #status{font-size:13px;}
  #status.ok{color:var(--ok);}
  #status.err{color:var(--err);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- 编辑器工具栏与音乐面板 ---------- */
  .editor-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .editor-bar label{margin:0;}
  .tool-btn{
    padding:6px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:12px;cursor:pointer;
  }
  .tool-btn:hover{border-color:var(--primary);color:var(--primary);}
  .music-panel{
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
    padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;
  }
  .music-panel.hidden{display:none;}
  .music-panel input[type=file]{
    width:100%;color:var(--muted);font-size:12px;padding:6px 0;
  }
  .music-panel input[type=file]::file-selector-button{
    margin-right:8px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;
  }
  #music-status{font-size:12px;}
  #music-status.ok{color:var(--ok);}
  #music-status.err{color:var(--err);}
  .music-divider{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-size:12px;color:var(--muted);}
  .music-panel select{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;outline:none;
  }
  .music-panel select:focus{border-color:var(--primary);}
  .music-hint{font-size:11px;color:var(--muted);line-height:1.6;}
  #meting-status{font-size:12px;}
  #meting-status.ok{color:var(--ok);}
  #meting-status.err{color:var(--err);}
  /* 搜索结果列表 */
  .search-results{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;font-size:13px;}
  .sr-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
  .sr-item strong{display:block;color:var(--text);font-weight:600;font-size:13px;}
  .sr-item span{color:var(--muted);font-size:12px;}
  .sr-item button{padding:6px 10px;border:0;border-radius:6px;background:var(--primary);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap;}
  .sr-item button:hover{filter:brightness(1.1);}
  .ghost{background:transparent !important;color:var(--muted) !important;border:1px solid var(--line) !important;}
  /* ---------- 登录验证层 ---------- */
  .login{
    position:fixed;inset:0;z-index:100;
    background:rgba(8,16,32,.94);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
  }
  .login.hidden{display:none;}
  .login-card{
    width:min(90vw,380px);background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .login-card h1{font-size:18px;margin:0 0 6px;}
  .login-card p{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6;}
  .login-card input{
    width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:14px;outline:none;margin-bottom:12px;
  }
  .login-card input:focus{border-color:var(--primary);}
  .login-card button{
    width:100%;padding:11px;border:0;border-radius:8px;background:var(--primary);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  }
  .login-card button:disabled{opacity:.5;cursor:not-allowed;}
  #login-status{font-size:12px;margin-top:10px;text-align:center;min-height:16px;}
  #login-status.err{color:var(--err);}
  #login-status.ok{color:var(--ok);}

  /* ---------- 手机适配 ---------- */
  @media(max-width:820px){
    body{flex-direction:column;height:auto;overflow:auto;}
    aside{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line);max-height:34vh;}
    #list{max-height:24vh;}
    main{padding:16px;overflow:visible;}
    .main-scroll{overflow:visible;}
    textarea{height:auto;min-height:260px;}
    .item-btn{opacity:1;}   /* 手机没有悬停，按钮常显 */
  }
</style>
</head>
<body>

<!-- 登录验证层：验证通过后自动隐藏 -->
<div class="login" id="login">
  <div class="login-card">
    <h1>🔒 写作后台</h1>
    <p>输入密码进入（仅限博主本人）。</p>
    <input type="password" id="login-password" placeholder="密码">
    <button id="login-btn">进入后台</button>
    <div id="login-status"></div>
  </div>
</div>

<!-- 左侧：文章列表 -->
<aside>
  <div class="side-head">
    <h1>📝 写作后台</h1>
    <button id="btn-new">+ 新建文章</button>
  </div>
  <div class="side-search">
    <input type="text" id="search-input" placeholder="搜索标题或分类">
  </div>
  <div class="side-filter">
    <button type="button" class="filter-btn active" data-filter="all">全部</button>
    <button type="button" class="filter-btn" data-filter="pub">已发布</button>
    <button type="button" class="filter-btn" data-filter="hid">隐藏</button>
  </div>
  <div id="list"></div>
</aside>

<!-- 右侧：编辑区 -->
<main>
  <div class="main-scroll">
  <div class="token-box" id="tokenBox">
    <label for="token">GitHub Token（只需填一次，存在本机浏览器）</label>
    <input type="password" id="token" placeholder="ghp_...">
  </div>

  <div class="fields">
    <div class="row">
      <div>
        <label for="title">标题</label>
        <input type="text" id="title" placeholder="文章标题">
      </div>
      <div>
        <label for="tags">标签（逗号分隔）</label>
        <input type="text" id="tags" placeholder="随笔, 阅读">
      </div>
      <div>
        <label for="category">分类</label>
        <input type="text" id="category" placeholder="生活">
      </div>
    </div>

    <div class="editor">
      <div class="editor-bar">
        <label for="body">正文（Markdown）</label>
        <button type="button" class="tool-btn" id="btn-music">🎵 插入音乐播放器</button>
      </div>

      <!-- 音乐上传面板：默认隐藏，点「插入音乐播放器」展开 -->
      <div class="music-panel hidden" id="musicPanel">
        <div class="row">
          <div>
            <label>歌名</label>
            <input type="text" id="m-title" placeholder="不填就用文件名">
          </div>
          <div>
            <label>歌手</label>
            <input type="text" id="m-author" placeholder="不填显示「未知」">
          </div>
        </div>
        <div class="row">
          <div>
            <label>音频文件（必选）</label>
            <input type="file" id="m-audio" accept="audio/*">
          </div>
          <div>
            <label>封面图（可选）</label>
            <input type="file" id="m-cover" accept="image/*">
          </div>
          <div>
            <label>歌词 .lrc（可选）</label>
            <input type="file" id="m-lrc" accept=".lrc">
          </div>
        </div>
        <div class="actions">
          <button type="button" id="btn-insert-music">上传并插入</button>
          <button type="button" id="btn-cancel-music" class="ghost">取消</button>
          <span id="music-status"></span>
        </div>

        <!-- 分隔：平台歌曲 -->
        <div class="music-divider">或从音乐平台插入（不占仓库空间，但版权歌曲只有 30 秒试听）</div>

        <div class="row">
          <div>
            <label>平台</label>
            <select id="m-server">
              <option value="netease">网易云音乐</option>
              <option value="tencent">QQ 音乐</option>
              <option value="kugou">酷狗音乐</option>
              <option value="baidu">百度音乐</option>
            </select>
          </div>
          <div>
            <label>类型</label>
            <select id="m-type">
              <option value="song">单曲</option>
              <option value="playlist">歌单</option>
              <option value="album">专辑</option>
            </select>
          </div>
          <div>
            <label>歌曲 / 歌单 ID</label>
            <input type="text" id="m-id" placeholder="如 1824045033">
          </div>
        </div>
        <div class="actions">
          <button type="button" id="btn-insert-meting">插入平台歌曲</button>
          <span id="meting-status"></span>
        </div>
        <div class="music-hint">ID 怎么找：打开网易云歌曲页，地址里 <code>id=</code> 后面的那串数字就是。</div>

        <!-- 搜索：找到歌后点「填入 ID」即可 -->
        <div class="music-divider">搜索歌曲（自动填入 ID）</div>
        <div class="row">
          <div style="flex:3">
            <label>关键词</label>
            <input type="text" id="m-keyword" placeholder="歌名或歌手，例如：晴天">
          </div>
          <div style="flex:1;display:flex;align-items:flex-end">
            <button type="button" class="tool-btn" id="btn-search-music" style="width:100%;height:38px">搜索</button>
          </div>
        </div>
        <div class="search-results" id="search-results"></div>
      </div>

      <textarea id="body" placeholder="## 小标题&#10;&#10;直接写内容就行。"></textarea>
    </div>
  </div>
  </div>

  <div class="actions">
    <button id="btn-save">保存并发布</button>
    <button id="btn-delete" disabled>删除</button>
    <span id="status"></span>
  </div>
</main>

<script>
// ============================================================
// 配置
// ============================================================
const OWNER = "KeivenJian";
const REPO = "Keiven-simple-blog";
const API = "https://api.github.com";
const POSTS_DIR = "source/_posts";
const DRAFTS_DIR = "source/_drafts";

const $ = (id) => document.getElementById(id);
const statusEl = $("status");

// 当前正在编辑的文件名（null 表示新建）
let currentName = null;
let currentSha = null;

// ============================================================
// 密码验证 + Token 管理
// ============================================================
// 密码的 SHA-256 摘要（源码里不放明文；哈希是单向的，输入后比对）
const PASS_HASH = "ddafe4f7c213973a5e2b2d8c8a786b98f55fe3e572aa68ecb15466835b4dccf5";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// 进入后台：隐藏登录层；如果之前存过 Token 就自动恢复
function enterApp() {
  const saved = localStorage.getItem("gh_token");
  if (saved) {
    $("token").value = saved;
    $("tokenBox").classList.add("hidden");
    loadList();
  }
  $("login").classList.add("hidden");
}

// 登录按钮：密码正确才放行
async function tryLogin() {
  const pwd = $("login-password").value;
  const st = $("login-status");
  if (!pwd) { st.textContent = "请输入密码"; st.className = "err"; return; }

  $("login-btn").disabled = true;
  st.textContent = "验证中……";
  st.className = "";

  const ok = (await sha256(pwd)) === PASS_HASH;
  $("login-btn").disabled = false;

  if (ok) {
    localStorage.setItem("admin_auth", "1");   // 记住登录状态
    st.textContent = "验证通过";
    st.className = "ok";
    enterApp();
  } else {
    st.textContent = "密码错误";
    st.className = "err";
  }
}

$("login-btn").addEventListener("click", tryLogin);
$("login-password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryLogin();
});

// 后台内更换 Token（发布文章时 GitHub API 需要它，但只存在本机浏览器）
$("token").addEventListener("change", () => {
  localStorage.setItem("gh_token", $("token").value.trim());
  loadList();
});

function getToken() {
  const t = $("token").value.trim();
  if (!t) setStatus("请先填 GitHub Token", "err");
  return t;
}

// ============================================================
// 工具函数
// ============================================================
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function pad(n) { return String(n).padStart(2, "0"); }

function nowStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// UTF-8 安全的 base64 编码
function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function fromBase64(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));
}

// ============================================================
// GitHub API 封装
// ============================================================
async function api(path, options = {}) {
  const token = getToken();
  if (!token) throw new Error("缺少 Token");
  const res = await fetch(`${API}/repos/${OWNER}/${REPO}/${path}`, {
    ...options,
    headers: {
      Authorization: `token ${token}`,
      Accept: "application/vnd.github+json",
      ...(options.body ? { "Content-Type": "application/json" } : {}),
      ...(options.headers || {})
    }
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // Token 失效 / 权限不足：自动把输入框放出来，方便重新填写
    if (res.status === 401 || res.status === 403) {
      $("tokenBox").classList.remove("hidden");
      setStatus("Token 失效或权限不足，请重新填写", "err");
    }
    throw new Error(`HTTP ${res.status} ${data.message || ""}`);
  }
  return data;
}

// ============================================================
// 文章列表
// ============================================================
async function loadList() {
  const listEl = $("list");
  listEl.innerHTML = '<div class="item">加载中……</div>';
  try {
    // 同时读取「已发布」和「草稿（隐藏）」两个目录
    const [published, drafts] = await Promise.all([
      api(`contents/${POSTS_DIR}`).catch(() => []),
      api(`contents/${DRAFTS_DIR}`).catch(() => [])
    ]);
    $("tokenBox").classList.add("hidden");   // Token 有效：收起输入框

    const pubFiles = (published || [])
      .filter((f) => f.name.endsWith(".md"))
      .map((f) => ({ name: f.name, hidden: false }));
    const draftFiles = (drafts || [])
      .filter((f) => f.name.endsWith(".md"))
      .map((f) => ({ name: f.name, hidden: true }));
    const files = pubFiles.concat(draftFiles);

    if (!files.length) {
      listEl.innerHTML = '<div class="item">还没有文章</div>';
      return;
    }

    // 并行读取每篇文章的分类
    const metas = await Promise.all(
      files.map(async (f) => {
        try {
          const dir = f.hidden ? DRAFTS_DIR : POSTS_DIR;
          const data = await api(`contents/${dir}/${encodeURIComponent(f.name)}`);
          const { meta } = parseFrontMatter(fromBase64(data.content));
          return {
            name: f.name,
            category: (meta.categories || [])[0] || "",
            hide: f.hidden
          };
        } catch (e) {
          return { name: f.name, category: "", hide: f.hidden };
        }
      })
    );

    metas.sort((a, b) => b.name.localeCompare(a.name));
    listEl.innerHTML = "";
    metas.forEach(renderItem);
    applySearch();
  } catch (e) {
    listEl.innerHTML = `<div class="item">加载失败：${e.message}</div>`;
  }
}

// 渲染一个文章条目：标题 + 分类 + 隐藏/删除按钮
function renderItem(m) {
  const div = document.createElement("div");
  div.className = "item" + (m.hide ? " hidden-post" : "");
  div.dataset.name = m.name;
  div.dataset.category = m.category || "";
  div.dataset.hidden = m.hide ? "1" : "0";

  const main = document.createElement("div");
  main.className = "item-main";
  const nameEl = document.createElement("span");
  nameEl.className = "item-name";
  nameEl.textContent = m.name.replace(/\.md$/, "");
  const catEl = document.createElement("span");
  catEl.className = "item-cat";
  catEl.textContent = m.category || "未分类";
  main.appendChild(nameEl);
  main.appendChild(catEl);

  // 眼睛按钮：切换隐藏 / 显示
  const eye = document.createElement("button");
  eye.type = "button";
  eye.className = "item-btn eye";
  eye.textContent = m.hide ? "🙈" : "👁";
  eye.title = m.hide ? "当前已隐藏，点击显示" : "点击隐藏（首页/归档不再显示）";
  eye.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleHide(m.name, m.hide);
  });

  // 删除按钮
  const del = document.createElement("button");
  del.type = "button";
  del.className = "item-btn del";
  del.textContent = "×";
  del.title = "删除这篇文章";
  del.addEventListener("click", (e) => {
    e.stopPropagation();
    deletePost(m.name);
  });

  div.appendChild(main);
  div.appendChild(eye);
  div.appendChild(del);
  div.addEventListener("click", () => openPost(m.name));
  $("list").appendChild(div);
}

// 搜索 + 筛选：按关键词（标题/分类）和「全部/已发布/隐藏」过滤
let currentFilter = "all";
function applySearch() {
  const kw = ($("search-input").value || "").trim().toLowerCase();
  document.querySelectorAll("#list .item").forEach((el) => {
    const text = (el.dataset.name + " " + (el.dataset.category || "")).toLowerCase();
    const isHidden = el.dataset.hidden === "1";
    const matchKw = !kw || text.includes(kw);
    const matchFilter =
      currentFilter === "all" ||
      (currentFilter === "hid" ? isHidden : !isHidden);
    el.style.display = matchKw && matchFilter ? "" : "none";
  });
}
$("search-input").addEventListener("input", applySearch);

// 筛选按钮：全部 / 已发布 / 隐藏
document.querySelectorAll(".filter-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach((b) => {
      b.classList.toggle("active", b === btn);
    });
    applySearch();
  });
});

// 隐藏 / 显示文章：在 source/_posts 和 source/_drafts 之间移动文件
// 草稿目录不会被 Hexo 编译，所以隐藏的文章既不在首页也不生成页面
async function toggleHide(name, isHidden) {
  try {
    const fromDir = isHidden ? DRAFTS_DIR : POSTS_DIR;
    const toDir = isHidden ? POSTS_DIR : DRAFTS_DIR;

    // 读取原文件内容（base64 原样搬运）
    const data = await api(`contents/${fromDir}/${encodeURIComponent(name)}`);
    const content = String(data.content || "").replace(/\n/g, "");

    // 目标位置若已有同名文件，带上它的 sha 才能覆盖
    let targetSha = null;
    try {
      const existing = await api(`contents/${toDir}/${encodeURIComponent(name)}`);
      targetSha = existing.sha;
    } catch (e) { /* 不存在，正常新建 */ }

    const payload = {
      message: `${isHidden ? "show" : "hide"}: ${name}`,
      content,
      branch: "main"
    };
    if (targetSha) payload.sha = targetSha;

    // 先写入目标目录
    await api(`contents/${toDir}/${encodeURIComponent(name)}`, {
      method: "PUT",
      body: JSON.stringify(payload)
    });

    // 再删除原文件
    await api(`contents/${fromDir}/${encodeURIComponent(name)}`, {
      method: "DELETE",
      body: JSON.stringify({
        message: `${isHidden ? "show" : "hide"}: ${name}`,
        sha: data.sha,
        branch: "main"
      })
    });

    setStatus(isHidden ? "已显示（重新发布）" : "已隐藏（移到草稿，不参与构建）", "ok");
    loadList();
  } catch (e) {
    setStatus(`操作失败：${e.message}`, "err");
  }
}

// ============================================================
// 删除文章（列表内直接删）
// ============================================================
async function deletePost(name) {
  if (!confirm(`确定删除《${name.replace(/\.md$/, "")}》？\n\n删除后 1-2 分钟线上才消失，且无法撤销。`)) return;

  try {
    // 删除文件必须先拿到它的 sha
    const data = await api(`contents/${POSTS_DIR}/${encodeURIComponent(name)}`);
    await api(`contents/${POSTS_DIR}/${encodeURIComponent(name)}`, {
      method: "DELETE",
      body: JSON.stringify({
        message: `delete: ${name}`,
        sha: data.sha,
        branch: "main"
      })
    });

    // 删的正好是当前编辑的文章，就清空表单
    if (currentName === name) resetForm();

    setStatus(`已删除：${name.replace(/\.md$/, "")}`, "ok");
    loadList();
  } catch (e) {
    setStatus(`删除失败：${e.message}`, "err");
  }
}

// ============================================================
// 打开文章
// ============================================================
async function openPost(name) {
  setStatus("加载中……", "");
  try {
    const data = await api(`contents/${POSTS_DIR}/${encodeURIComponent(name)}`);
    const text = fromBase64(data.content);
    const { meta, body } = parseFrontMatter(text);

    $("title").value = meta.title || name.replace(/\.md$/, "");
    $("tags").value = (meta.tags || []).join(", ");
    $("category").value = (meta.categories || [])[0] || "";
    $("body").value = body.trim();

    currentName = name;
    currentSha = data.sha;
    $("btn-delete").disabled = false;
    document.querySelectorAll(".item").forEach((el) => {
      el.classList.toggle("active", el.dataset.name === name);
    });
    setStatus(`已打开：${name}`, "ok");
  } catch (e) {
    setStatus(`打开失败：${e.message}`, "err");
  }
}

// ============================================================
// Markdown 解析与生成
// ============================================================
// 解析 front-matter（标题/标签/分类），返回 { meta, body }
function parseFrontMatter(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  let key = null;
  m[1].split(/\r?\n/).forEach((line) => {
    const t = line.trim();
    if (!t) return;
    if (t.startsWith("- ")) {
      if (key) meta[key].push(t.slice(2).trim());
    } else {
      const idx = t.indexOf(":");
      if (idx > 0) {
        const k = t.slice(0, idx).trim();
        const v = t.slice(idx + 1).trim();
        if (k === "tags" || k === "categories") {
          meta[k] = [];
          key = k;
        } else {
          meta[k] = v;
          key = null;
        }
      }
    }
  });
  return { meta, body: m[2] };
}

// 生成完整 Markdown（front-matter + 正文）
function buildMarkdown(title, tags, category, body, date) {
  const lines = ["---", `title: ${title}`, `date: ${date || nowStr()}`];
  const tagList = tags.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  if (tagList.length) {
    lines.push("tags:");
    tagList.forEach((t) => lines.push(`  - ${t}`));
  }
  if (category.trim()) {
    lines.push("categories:");
    lines.push(`  - ${category.trim()}`);
  }
  lines.push("---", "", body.trim(), "");
  return lines.join("\n");
}

// ============================================================
// 文件上传（音乐播放器用）
// ============================================================
// 文件转 base64（GitHub Contents API 要求）
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// 上传一个文件到仓库指定目录，返回站点内路径（如 /music/xxx.mp3）
async function uploadFile(file, dir) {
  if (!getToken()) throw new Error("缺少 Token");
  if (file.size > 10 * 1024 * 1024) throw new Error("文件超过 10MB，建议压缩后再传");

  const name = file.name;
  const path = `${dir}/${name}`;
  const content = await fileToBase64(file);

  // 同名文件已存在时，更新必须带上 sha
  let sha = null;
  try {
    const existing = await api(`contents/${encodeURIComponent(path)}`);
    sha = existing.sha;
  } catch (e) { /* 文件不存在，正常继续 */ }

  const payload = { message: `upload: ${name}`, content, branch: "main" };
  if (sha) payload.sha = sha;

  await api(`contents/${encodeURIComponent(path)}`, {
    method: "PUT",
    body: JSON.stringify(payload)
  });

  return `/${path}`;
}

// 在正文光标位置插入文本
function insertAtCursor(text) {
  const ta = $("body");
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + text.length;
  ta.focus();
}

// 展开 / 收起音乐上传面板
$("btn-music").addEventListener("click", () => {
  $("musicPanel").classList.toggle("hidden");
});
$("btn-cancel-music").addEventListener("click", () => {
  $("musicPanel").classList.add("hidden");
  $("music-status").textContent = "";
});

// 上传音频（可选封面/歌词）并插入 aplayer 标签
$("btn-insert-music").addEventListener("click", async () => {
  const st = $("music-status");
  const audio = $("m-audio").files[0];
  if (!audio) { st.textContent = "请先选择音频文件"; st.className = "err"; return; }

  const btn = $("btn-insert-music");
  btn.disabled = true;
  st.textContent = "上传中……";
  st.className = "";

  try {
    const title = $("m-title").value.trim() || audio.name.replace(/\.[^.]+$/, "");
    const author = $("m-author").value.trim() || "未知";

    // 音频放 music/，封面放 images/，歌词放 music/
    const audioPath = await uploadFile(audio, "music");
    st.textContent = "音频已上传，处理其他文件……";

    let coverPath = null;
    const cover = $("m-cover").files[0];
    if (cover) coverPath = await uploadFile(cover, "images");

    let lrcPath = null;
    const lrc = $("m-lrc").files[0];
    if (lrc) lrcPath = await uploadFile(lrc, "music");

    let tag = `{% aplayer "${title}" "${author}" "${audioPath}"`;
    if (coverPath) tag += ` "${coverPath}"`;
    if (lrcPath) tag += ` "lrc:${lrcPath}"`;
    tag += " %}";

    insertAtCursor(tag);
    st.textContent = "✅ 已插入到正文光标位置";
    st.className = "ok";
    $("m-audio").value = "";
    $("m-cover").value = "";
    $("m-lrc").value = "";
  } catch (e) {
    st.textContent = `上传失败：${e.message}`;
    st.className = "err";
  } finally {
    btn.disabled = false;
  }
});

// 从 Meting 返回的地址里提取歌曲 ID
function extractId(url) {
  const m = String(url).match(/[?&]id=(\d+)/);
  return m ? m[1] : "";
}

// 搜索平台歌曲：结果显示为列表，点击「填入 ID」
$("btn-search-music").addEventListener("click", async () => {
  const kw = $("m-keyword").value.trim();
  const box = $("search-results");
  if (!kw) { box.textContent = "请输入关键词"; return; }

  const server = $("m-server").value;
  box.textContent = "搜索中……";

  try {
    const res = await fetch(
      `https://api.i-meto.com/meting/api?server=${server}&type=search&keyword=${encodeURIComponent(kw)}`
    );
    if (!res.ok) throw new Error("HTTP " + res.status);
    const list = await res.json();

    box.innerHTML = "";
    if (!list.length) { box.textContent = "没有找到结果"; return; }

    list.slice(0, 10).forEach((item) => {
      const id = extractId(item.url);
      const row = document.createElement("div");
      row.className = "sr-item";

      const info = document.createElement("div");
      const strong = document.createElement("strong");
      strong.textContent = item.title || "(无标题)";
      const span = document.createElement("span");
      span.textContent = `${item.author || ""} · ID ${id}`;
      info.appendChild(strong);
      info.appendChild(span);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "填入 ID";
      btn.addEventListener("click", () => {
        $("m-id").value = id;
        $("meting-status").textContent = "已填入 ID，点「插入平台歌曲」";
        $("meting-status").className = "ok";
      });

      row.appendChild(info);
      row.appendChild(btn);
      box.appendChild(row);
    });
  } catch (e) {
    box.textContent = "搜索失败：" + e.message + "（第三方接口可能不稳定）";
  }
});

// 插入平台歌曲（Meting）：生成 {% meting "ID" "平台" "类型" %}
$("btn-insert-meting").addEventListener("click", () => {
  const st = $("meting-status");
  const id = $("m-id").value.trim();
  if (!id) { st.textContent = "请输入歌曲/歌单 ID"; st.className = "err"; return; }

  const server = $("m-server").value;
  const type = $("m-type").value;
  const tag = `{% meting "${id}" "${server}" "${type}" %}`;

  insertAtCursor(tag);
  st.textContent = "✅ 已插入到正文";
  st.className = "ok";
  $("m-id").value = "";
});

// ============================================================
// 保存
// ============================================================
$("btn-save").addEventListener("click", async () => {
  const title = $("title").value.trim();
  const tags = $("tags").value;
  const category = $("category").value;
  const body = $("body").value;

  if (!title) return setStatus("标题不能为空", "err");
  if (!body.trim()) return setStatus("正文不能为空", "err");

  const btn = $("btn-save");
  btn.disabled = true;
  setStatus("正在保存……", "");

  try {
    const name = currentName || `${title.replace(/[\/\\:*?"<>|]/g, "")}.md`;
    const content = toBase64(buildMarkdown(title, tags, category, body));
    const payload = {
      message: `${currentSha ? "update" : "post"}: ${title}`,
      content,
      branch: "main"
    };
    if (currentSha) payload.sha = currentSha;

    const res = await api(`contents/${POSTS_DIR}/${encodeURIComponent(name)}`, {
      method: "PUT",
      body: JSON.stringify(payload)
    });

    currentName = name;
    currentSha = res.content.sha;
    $("btn-delete").disabled = false;
    setStatus(`✅ 已保存，1-2 分钟后线上更新`, "ok");
    loadList();
  } catch (e) {
    setStatus(`保存失败：${e.message}`, "err");
  } finally {
    btn.disabled = false;
  }
});

// ============================================================
// 删除
// ============================================================
$("btn-delete").addEventListener("click", async () => {
  if (!currentName || !currentSha) return;
  if (!confirm(`确定删除《${currentName.replace(/\.md$/, "")}》？`)) return;

  const btn = $("btn-delete");
  btn.disabled = true;
  setStatus("正在删除……", "");

  try {
    await api(`contents/${POSTS_DIR}/${encodeURIComponent(currentName)}`, {
      method: "DELETE",
      body: JSON.stringify({
        message: `delete: ${currentName}`,
        sha: currentSha,
        branch: "main"
      })
    });
    setStatus("✅ 已删除", "ok");
    resetForm();
    loadList();
  } catch (e) {
    setStatus(`删除失败：${e.message}`, "err");
    btn.disabled = false;
  }
});

// ============================================================
// 新建
// ============================================================
$("btn-new").addEventListener("click", resetForm);

function resetForm() {
  currentName = null;
  currentSha = null;
  $("title").value = "";
  $("tags").value = "";
  $("category").value = "";
  $("body").value = "";
  $("btn-delete").disabled = true;
  document.querySelectorAll(".item").forEach((el) => el.classList.remove("active"));
  setStatus("新建文章", "");
}

// ============================================================
// 初始化：验证过就直接进入，否则停在登录页
// ============================================================
if (localStorage.getItem("admin_auth") === "1") {
  enterApp();
}
