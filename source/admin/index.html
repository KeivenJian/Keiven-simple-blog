<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Keiven Blog · 写作后台</title>
<style>
  :root{
    --bg:#0b1a33; --panel:#101f3d; --panel-2:#152a4f; --line:#243b63;
    --text:#e8eefc; --muted:#8ea4c8; --primary:#4d6bfe; --ok:#2dd4a7; --err:#ff6b81;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    display:flex;height:100vh;overflow:hidden;
  }
  /* ---------- 左侧文章列表 ---------- */
  aside{
    width:280px;flex:0 0 280px;background:var(--panel);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  .side-head{padding:18px 16px;border-bottom:1px solid var(--line);}
  .side-head h1{font-size:16px;margin:0 0 12px;letter-spacing:.5px;}
  .side-head button{
    width:100%;padding:9px;border:0;border-radius:8px;background:var(--primary);
    color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  }
  .side-head button:hover{filter:brightness(1.1);}
  #list{flex:1;overflow-y:auto;padding:8px;}
  .item{
    padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;
  }
  .item:hover{background:var(--panel-2);color:var(--text);}
  .item.active{background:var(--panel-2);color:#fff;box-shadow:inset 3px 0 0 var(--primary);}
  /* ---------- 右侧编辑区 ---------- */
  main{flex:1;display:flex;flex-direction:column;padding:20px 24px;gap:12px;min-width:0;}
  .token-box{
    border:1px dashed var(--line);border-radius:10px;padding:12px 14px;
    background:var(--panel);
  }
  .token-box.hidden{display:none;}
  .token-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .token-box input{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:13px;outline:none;
  }
  .row{display:flex;gap:12px;}
  .row > div{flex:1;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input[type=text],textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;font-family:inherit;
    outline:none;
  }
  input:focus,textarea:focus{border-color:var(--primary);}
  textarea{flex:1;resize:none;min-height:200px;line-height:1.7;font-size:14px;}
  .fields{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;}
  .editor{flex:1;display:flex;flex-direction:column;min-height:0;}
  .actions{display:flex;align-items:center;gap:12px;}
  .actions button{
    padding:10px 20px;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  #btn-save{background:var(--primary);color:#fff;}
  #btn-save:hover{filter:brightness(1.1);}
  #btn-delete{background:transparent;color:var(--err);border:1px solid var(--err);}
  #btn-delete:hover{background:rgba(255,107,129,.12);}
  #btn-delete:disabled{opacity:.35;cursor:not-allowed;}
  #status{font-size:13px;}
  #status.ok{color:var(--ok);}
  #status.err{color:var(--err);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  /* ---------- 登录验证层 ---------- */
  .login{
    position:fixed;inset:0;z-index:100;
    background:rgba(8,16,32,.94);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
  }
  .login.hidden{display:none;}
  .login-card{
    width:min(90vw,380px);background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .login-card h1{font-size:18px;margin:0 0 6px;}
  .login-card p{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6;}
  .login-card input{
    width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:14px;outline:none;margin-bottom:12px;
  }
  .login-card input:focus{border-color:var(--primary);}
  .login-card button{
    width:100%;padding:11px;border:0;border-radius:8px;background:var(--primary);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  }
  .login-card button:disabled{opacity:.5;cursor:not-allowed;}
  #login-status{font-size:12px;margin-top:10px;text-align:center;min-height:16px;}
  #login-status.err{color:var(--err);}
  #login-status.ok{color:var(--ok);}

  /* ---------- 手机适配 ---------- */
  @media(max-width:820px){
    body{flex-direction:column;height:auto;overflow:auto;}
    aside{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line);max-height:34vh;}
    #list{max-height:24vh;}
    main{padding:16px;}
    textarea{min-height:260px;}
  }
</style>
</head>
<body>

<!-- 登录验证层：验证通过后自动隐藏 -->
<div class="login" id="login">
  <div class="login-card">
    <h1>🔒 写作后台</h1>
    <p>需要 GitHub Token 验证身份，只有仓库所有者能进入。</p>
    <input type="password" id="login-token" placeholder="ghp_...">
    <button id="login-btn">验证并进入</button>
    <div id="login-status"></div>
  </div>
</div>

<!-- 左侧：文章列表 -->
<aside>
  <div class="side-head">
    <h1>📝 写作后台</h1>
    <button id="btn-new">+ 新建文章</button>
  </div>
  <div id="list"></div>
</aside>

<!-- 右侧：编辑区 -->
<main>
  <div class="token-box" id="tokenBox">
    <label for="token">GitHub Token（只需填一次，存在本机浏览器）</label>
    <input type="password" id="token" placeholder="ghp_...">
  </div>

  <div class="fields">
    <div class="row">
      <div>
        <label for="title">标题</label>
        <input type="text" id="title" placeholder="文章标题">
      </div>
      <div>
        <label for="tags">标签（逗号分隔）</label>
        <input type="text" id="tags" placeholder="随笔, 阅读">
      </div>
      <div>
        <label for="category">分类</label>
        <input type="text" id="category" placeholder="生活">
      </div>
    </div>

    <div class="editor">
      <label for="body">正文（Markdown）</label>
      <textarea id="body" placeholder="## 小标题&#10;&#10;直接写内容就行。"></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="btn-save">保存并发布</button>
    <button id="btn-delete" disabled>删除</button>
    <span id="status"></span>
  </div>
</main>

<script>
// ============================================================
// 配置
// ============================================================
const OWNER = "KeivenJian";
const REPO = "Keiven-simple-blog";
const API = "https://api.github.com";
const POSTS_DIR = "source/_posts";

const $ = (id) => document.getElementById(id);
const statusEl = $("status");

// 当前正在编辑的文件名（null 表示新建）
let currentName = null;
let currentSha = null;

// ============================================================
// Token 管理 + 身份验证
// ============================================================
// 验证 Token 对应的 GitHub 账号；返回用户名，失败返回 null
async function verifyToken(token) {
  try {
    const res = await fetch(`${API}/user`, {
      headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json" }
    });
    if (!res.ok) return null;
    const u = await res.json();
    return u.login;
  } catch (e) {
    return null;
  }
}

// 验证通过：隐藏登录层，进入后台
function enterApp(token) {
  $("token").value = token;
  $("tokenBox").classList.add("hidden");
  $("login").classList.add("hidden");
  loadList();
}

// 登录按钮：验证通过才放行
async function tryLogin() {
  const t = $("login-token").value.trim();
  const st = $("login-status");
  if (!t) { st.textContent = "请输入 Token"; st.className = "err"; return; }

  $("login-btn").disabled = true;
  st.textContent = "验证中……";
  st.className = "";

  const login = await verifyToken(t);
  $("login-btn").disabled = false;

  if (login === OWNER) {
    localStorage.setItem("gh_token", t);
    st.textContent = "验证通过";
    st.className = "ok";
    enterApp(t);
  } else if (login) {
    st.textContent = `该 Token 属于 ${login}，不是本站所有者`;
    st.className = "err";
  } else {
    st.textContent = "Token 无效或已过期";
    st.className = "err";
  }
}

$("login-btn").addEventListener("click", tryLogin);
$("login-token").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryLogin();
});

// 后台内仍可更换 Token（比如过期后）
$("token").addEventListener("change", () => {
  localStorage.setItem("gh_token", $("token").value.trim());
  loadList();
});

function getToken() {
  const t = $("token").value.trim();
  if (!t) setStatus("请先填 GitHub Token", "err");
  return t;
}

// ============================================================
// 工具函数
// ============================================================
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function pad(n) { return String(n).padStart(2, "0"); }

function nowStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// UTF-8 安全的 base64 编码
function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function fromBase64(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));
}

// ============================================================
// GitHub API 封装
// ============================================================
async function api(path, options = {}) {
  const token = getToken();
  if (!token) throw new Error("缺少 Token");
  const res = await fetch(`${API}/repos/${OWNER}/${REPO}/${path}`, {
    ...options,
    headers: {
      Authorization: `token ${token}`,
      Accept: "application/vnd.github+json",
      ...(options.body ? { "Content-Type": "application/json" } : {}),
      ...(options.headers || {})
    }
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`HTTP ${res.status} ${data.message || ""}`);
  return data;
}

// ============================================================
// 文章列表
// ============================================================
async function loadList() {
  const listEl = $("list");
  listEl.innerHTML = '<div class="item">加载中……</div>';
  try {
    const items = await api(`contents/${POSTS_DIR}`);
    listEl.innerHTML = "";
    if (!items.length) {
      listEl.innerHTML = '<div class="item">还没有文章</div>';
      return;
    }
    items
      .filter((f) => f.name.endsWith(".md"))
      .sort((a, b) => b.name.localeCompare(a.name))
      .forEach((f) => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = f.name.replace(/\.md$/, "");
        div.dataset.name = f.name;
        div.addEventListener("click", () => openPost(f.name));
        listEl.appendChild(div);
      });
  } catch (e) {
    listEl.innerHTML = `<div class="item">加载失败：${e.message}</div>`;
  }
}

// ============================================================
// 打开文章
// ============================================================
async function openPost(name) {
  setStatus("加载中……", "");
  try {
    const data = await api(`contents/${POSTS_DIR}/${encodeURIComponent(name)}`);
    const text = fromBase64(data.content);
    const { meta, body } = parseFrontMatter(text);

    $("title").value = meta.title || name.replace(/\.md$/, "");
    $("tags").value = (meta.tags || []).join(", ");
    $("category").value = (meta.categories || [])[0] || "";
    $("body").value = body.trim();

    currentName = name;
    currentSha = data.sha;
    $("btn-delete").disabled = false;
    document.querySelectorAll(".item").forEach((el) => {
      el.classList.toggle("active", el.dataset.name === name);
    });
    setStatus(`已打开：${name}`, "ok");
  } catch (e) {
    setStatus(`打开失败：${e.message}`, "err");
  }
}

// ============================================================
// Markdown 解析与生成
// ============================================================
// 解析 front-matter（标题/标签/分类），返回 { meta, body }
function parseFrontMatter(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  let key = null;
  m[1].split(/\r?\n/).forEach((line) => {
    const t = line.trim();
    if (!t) return;
    if (t.startsWith("- ")) {
      if (key) meta[key].push(t.slice(2).trim());
    } else {
      const idx = t.indexOf(":");
      if (idx > 0) {
        const k = t.slice(0, idx).trim();
        const v = t.slice(idx + 1).trim();
        if (k === "tags" || k === "categories") {
          meta[k] = [];
          key = k;
        } else {
          meta[k] = v;
          key = null;
        }
      }
    }
  });
  return { meta, body: m[2] };
}

// 生成完整 Markdown（front-matter + 正文）
function buildMarkdown(title, tags, category, body, date) {
  const lines = ["---", `title: ${title}`, `date: ${date || nowStr()}`];
  const tagList = tags.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  if (tagList.length) {
    lines.push("tags:");
    tagList.forEach((t) => lines.push(`  - ${t}`));
  }
  if (category.trim()) {
    lines.push("categories:");
    lines.push(`  - ${category.trim()}`);
  }
  lines.push("---", "", body.trim(), "");
  return lines.join("\n");
}

// ============================================================
// 保存
// ============================================================
$("btn-save").addEventListener("click", async () => {
  const title = $("title").value.trim();
  const tags = $("tags").value;
  const category = $("category").value;
  const body = $("body").value;

  if (!title) return setStatus("标题不能为空", "err");
  if (!body.trim()) return setStatus("正文不能为空", "err");

  const btn = $("btn-save");
  btn.disabled = true;
  setStatus("正在保存……", "");

  try {
    const name = currentName || `${title.replace(/[\/\\:*?"<>|]/g, "")}.md`;
    const content = toBase64(buildMarkdown(title, tags, category, body));
    const payload = {
      message: `${currentSha ? "update" : "post"}: ${title}`,
      content,
      branch: "main"
    };
    if (currentSha) payload.sha = currentSha;

    const res = await api(`contents/${POSTS_DIR}/${encodeURIComponent(name)}`, {
      method: "PUT",
      body: JSON.stringify(payload)
    });

    currentName = name;
    currentSha = res.content.sha;
    $("btn-delete").disabled = false;
    setStatus(`✅ 已保存，1-2 分钟后线上更新`, "ok");
    loadList();
  } catch (e) {
    setStatus(`保存失败：${e.message}`, "err");
  } finally {
    btn.disabled = false;
  }
});

// ============================================================
// 删除
// ============================================================
$("btn-delete").addEventListener("click", async () => {
  if (!currentName || !currentSha) return;
  if (!confirm(`确定删除《${currentName.replace(/\.md$/, "")}》？`)) return;

  const btn = $("btn-delete");
  btn.disabled = true;
  setStatus("正在删除……", "");

  try {
    await api(`contents/${POSTS_DIR}/${encodeURIComponent(currentName)}`, {
      method: "DELETE",
      body: JSON.stringify({
        message: `delete: ${currentName}`,
        sha: currentSha,
        branch: "main"
      })
    });
    setStatus("✅ 已删除", "ok");
    resetForm();
    loadList();
  } catch (e) {
    setStatus(`删除失败：${e.message}`, "err");
    btn.disabled = false;
  }
});

// ============================================================
// 新建
// ============================================================
$("btn-new").addEventListener("click", resetForm);

function resetForm() {
  currentName = null;
  currentSha = null;
  $("title").value = "";
  $("tags").value = "";
  $("category").value = "";
  $("body").value = "";
  $("btn-delete").disabled = true;
  document.querySelectorAll(".item").forEach((el) => el.classList.remove("active"));
  setStatus("新建文章", "");
}

// ============================================================
// 初始化：有保存的 Token 就自动验证，否则显示登录层
// ============================================================
const savedToken = localStorage.getItem("gh_token");
if (savedToken) {
  verifyToken(savedToken).then((login) => {
    if (login === OWNER) {
      enterApp(savedToken);
    } else {
      // Token 不属于本站所有者，清掉并停在登录页
      localStorage.removeItem("gh_token");
    }
  });
}
</script>
</body>
</html>
