<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06132b"/>
      <stop offset="45%" stop-color="#123a7a"/>
      <stop offset="100%" stop-color="#3f7bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5b8dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5b8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="fishBody2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f1ff"/>
      <stop offset="100%" stop-color="#9fc0ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06132b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 海洋 -->
  <rect width="1920" height="1080" fill="url(#sea)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- 光束 -->
  <g opacity="0.18" fill="#cfe0ff">
    <polygon points="300,0 420,0 250,1080 120,1080"/>
    <polygon points="820,0 900,0 760,1080 660,1080"/>
    <polygon points="1400,0 1480,0 1330,1080 1230,1080"/>
  </g>

  <!-- 气泡 -->
  <g fill="#dbe8ff" opacity="0.5">
    <circle cx="260" cy="760" r="10"/>
    <circle cx="300" cy="700" r="6"/>
    <circle cx="340" cy="650" r="4"/>
    <circle cx="1520" cy="820" r="12"/>
    <circle cx="1570" cy="750" r="7"/>
    <circle cx="1610" cy="690" r="4"/>
    <circle cx="820" cy="900" r="8"/>
    <circle cx="860" cy="840" r="5"/>
    <circle cx="1120" cy="300" r="7"/>
    <circle cx="1160" cy="240" r="4"/>
  </g>

  <!-- 小游鱼（左） -->
  <g transform="translate(300 300) scale(0.55)" opacity="0.85">
    <path d="M150 0 L260 -75 L260 75 Z" fill="url(#fishBody2)"/>
    <ellipse rx="150" ry="100" fill="url(#fishBody2)"/>
    <circle cx="-80" cy="-28" r="16" fill="#12213f"/>
    <circle cx="-76" cy="-33" r="5" fill="#ffffff"/>
    <path d="M-10 -100 Q5 -150 55 -105" fill="#9fc0ff"/>
  </g>

  <!-- 主角：大肥鱼 -->
  <g transform="translate(1260 690)">
    <path d="M170 0 L300 -95 L300 95 Z" fill="url(#fishBody)"/>
    <ellipse rx="175" ry="125" fill="url(#fishBody)"/>
    <!-- 肚子 -->
    <ellipse cy="45" rx="120" ry="70" fill="#ffe8b0" opacity="0.85"/>
    <!-- 眼睛 -->
    <circle cx="-95" cy="-35" r="22" fill="#12213f"/>
    <circle cx="-88" cy="-42" r="7" fill="#ffffff"/>
    <!-- 腮红 -->
    <circle cx="-60" cy="30" r="16" fill="#ff9fb2" opacity="0.55"/>
    <!-- 嘴 -->
    <path d="M-175 20 Q-150 45 -125 20" stroke="#c67a3c" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 背鳍 -->
    <path d="M-20 -118 Q10 -185 70 -122" fill="#e08b4f"/>
    <!-- 侧鳍 -->
    <path d="M-10 60 Q30 120 90 70" fill="#e08b4f" opacity="0.9"/>
    <!-- 鳞片 -->
    <g fill="#ffffff" opacity="0.18">
      <circle cx="-30" cy="-10" r="16"/>
      <circle cx="20" cy="-25" r="14"/>
      <circle cx="60" cy="-5" r="12"/>
      <circle cx="10" cy="25" r="13"/>
    </g>
  </g>

  <!-- 小游鱼（右） -->
  <g transform="translate(1600 320) scale(0.4)" opacity="0.8">
    <path d="M150 0 L260 -75 L260 75 Z" fill="url(#fishBody)"/>
    <ellipse rx="150" ry="100" fill="url(#fishBody)"/>
    <circle cx="-80" cy="-28" r="16" fill="#12213f"/>
    <circle cx="-76" cy="-33" r="5" fill="#ffffff"/>
  </g>

  <!-- 底部波浪 -->
  <path d="M0 980 Q 240 900 480 980 T 960 980 T 1440 980 T 1920 980 V 1080 H 0 Z" fill="url(#wave)"/>
  <path d="M0 1030 Q 240 970 480 1030 T 960 1030 T 1440 1030 T 1920 1030 V 1080 H 0 Z" fill="#06132b" opacity="0.6"/>
</svg>
