# ---------------------------------------------------------------
# NexT 主题覆盖配置
# 只写需要改的项，其余继承 node_modules/hexo-theme-next/_config.yml
# 官方文档：https://theme-next.js.org/docs/
# ---------------------------------------------------------------

# 布局方案：Muse | Mist | Pisces | Gemini
scheme: Gemini

# 顶部菜单
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-layer-group
  about: /about/ || fa fa-user

menu_settings:
  icons: true
  badges: false

# 侧栏
sidebar:
  position: left

# 页脚
footer:
  since: 2026
  icon:
    name: Keiven
    animated: true
    color: "#ff6b6b"

# ---------------------------------------------------------------
# 评论系统：Utterances（数据存在 GitHub Issues）
# 使用前必须：
#   1. 仓库设为 public
#   2. 给仓库安装 https://github.com/apps/utterances
#   3. 把下面的 repo 改成 "你的GitHub用户名/仓库名"
# ---------------------------------------------------------------
comments:
  active: utterances

utterances:
  enable: true
  repo: KeivenJian/Keiven-simple-blog
  issue_term: pathname # 按路径匹配，换域名不丢评论
  theme: github-light

# ---------------------------------------------------------------
# 外观与功能
# ---------------------------------------------------------------

# 头像（本地托管，不依赖外链）
avatar:
  url: /images/avatar.png
  rounded: true
  rotated: true

# 社交链接
social:
  GitHub: https://github.com/KeivenJian || fab fa-github

social_icons:
  enable: true
  icons_only: false
  transition: true

# 顶部滚动阅读进度条
reading_progress:
  enable: true
  color: "#37c6c0"

# 代码块：深浅色主题 + 复制按钮
codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: true

# 本地搜索
local_search:
  enable: true

# 字数统计（依赖 hexo-word-counter）
symbols_count_time:
  separated_meta: true
  item_text_total: true

# 页面切换动效
motion:
  enable: true

